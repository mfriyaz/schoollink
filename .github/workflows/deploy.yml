name: Deploy to Production

# Runs automatically on every push to modern-ui. Unlike the
# previous SSH-based version, this runs directly ON the server
# itself via a self-hosted runner - no SSH connection, no key
# ever leaves the server, port 22 stays closed to the internet.

on:
  push:
    branches:
      - modern-ui

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Pull latest code
        run: |
          cd ~/schoollink
          git pull

      - name: Rebuild backend
        run: |
          cd ~/schoollink
          docker compose -f docker-compose.prod.yml up -d --build backend

      - name: Rebuild frontend
        run: |
          cd ~/schoollink
          docker run --rm -v $(pwd)/schoollink-frontend:/app -w /app node:20-slim sh -c "npm install && npm run build"
          sudo chmod -R o+rX /home/ubuntu/schoollink/schoollink-frontend/dist
