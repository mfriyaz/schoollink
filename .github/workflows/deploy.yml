name: Deploy to Production

# Runs automatically every time code is pushed to modern-ui.
# Uses the same steps we've been running by hand over SSH:
# pull the latest code, rebuild the backend container, rebuild
# the frontend, and fix its file permissions for Nginx.

on:
  push:
    branches:
      - modern-ui

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/schoollink
            git pull
            docker compose -f docker-compose.prod.yml up -d --build backend
            docker run --rm -v $(pwd)/schoollink-frontend:/app -w /app node:20-slim sh -c "npm install && npm run build"
            sudo chmod -R o+rX /home/ubuntu/schoollink/schoollink-frontend/dist
